name: Deploy Report Page → GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/data-*.json'
      - 'docs/manifest.json'
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM). Leave empty for current month."
        required: false
        type: string
  schedule:
    # 11:00 UTC (13:00 EET / 14:00 EEST – Bulgaria) every day
    - cron: "0 11 * * *"

permissions:
  contents: write  # needed to commit per-month data files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Generate data for month
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN_PUBLIC_REVEAL: ${{ secrets.GH_TOKEN_PUBLIC_REVEAL }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          elif [[ -n "${{ inputs.month }}" ]]; then
            MONTH="${{ inputs.month }}"
          else
            MONTH=$(date -u +%Y-%m)
          fi
          echo "Generating report for month: $MONTH"
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"
          python monthly_report.py --month "$MONTH" --json "docs/data-${MONTH}.json"

      - name: Update manifest
        if: github.event_name != 'push'
        run: python update_manifest.py "${{ env.MONTH }}"

      - name: Commit data files
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data-*.json docs/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: report data for ${{ env.MONTH }}"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
