<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal Monthly Report</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3;
           --muted: #8b949e; --green: #3fb950; --red: #f85149; --blue: #58a6ff;
           --btn: #238636; --btn-hover: #2ea043; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.6; }
  h1 { margin-bottom: .5rem; }
  .meta { color: var(--muted); margin-bottom: 1.5rem; font-size: .85rem; }
  .controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  button { background: var(--btn); color: #fff; border: none; border-radius: 6px;
           padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #output { display: none; }
  #output.visible { display: block; }
  .report-header { margin-bottom: 1.5rem; }
  .report-header h2 { font-size: 1.15rem; }
  .report-header .baseline { color: var(--muted); font-size: .85rem; }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
             padding: 1.5rem; margin-bottom: 1.25rem; }
  .section h3 { font-size: 1rem; margin-bottom: .25rem; }
  .section h3 a { color: var(--blue); text-decoration: none; }
  .section h3 a:hover { text-decoration: underline; }
  .section .window { color: var(--muted); font-size: .8rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .75rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  tr.sub-hdr td { font-weight: 600; color: var(--muted); padding-top: .9rem; border-bottom: none; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  tr.sub td:first-child { padding-left: 1.5rem; color: var(--muted); }
  .badge { display: inline-block; padding: .15rem .5rem; border-radius: 12px;
           font-size: .78rem; font-weight: 600; }
  .badge.up   { background: rgba(248,81,73,.15);   color: var(--red); }
  .badge.down { background: rgba(63,185,80,.15);   color: var(--green); }
  .badge.zero { background: rgba(139,148,158,.15); color: var(--muted); }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--border);
             border-top-color: var(--blue); border-radius: 50%;
             animation: spin .6s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--red); margin-top: 1rem; }
  @media (max-width: 600px) { body { padding: 1rem; } }
</style>
</head>
<body>

<h1>📊 Reveal Monthly Report</h1>
<p class="meta">Data is generated by the CI workflow and served as <code>data.json</code>.</p>

<div class="controls">
  <button id="btn" onclick="loadReport()">Reload</button>
  <span id="status"></span>
</div>

<div id="output"></div>

<script>
function badge(delta) {
  if (delta > 0) return `<span class="badge up">+${delta}</span>`;
  if (delta < 0) return `<span class="badge down">${delta}</span>`;
  return `<span class="badge zero">±0</span>`;
}

function renderSection(sec) {
  let rows = '';
  for (const m of sec.metrics) {
    rows += `<tr><td>${m.label}</td><td>${m.current}</td><td>${badge(m.delta)}</td></tr>\n`;
  }
  for (const sub of sec.subsections) {
    rows += `<tr class="sub-hdr"><td colspan="3">${sub.title}</td></tr>\n`;
    for (const m of sub.metrics) {
      rows += `<tr class="sub"><td>${m.label}</td><td>${m.current}</td><td>${badge(m.delta)}</td></tr>\n`;
    }
  }
  return `
  <div class="section">
    <h3><a href="${sec.url}">${sec.title}</a></h3>
    <p class="window">Window: ${sec.curr ?? ''} &nbsp;·&nbsp; compared to previous month</p>
    <table>
      <thead><tr><th>Metric</th><th>Count</th><th>vs prev month</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function loadReport() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Loading…';
  output.className = '';
  output.innerHTML = '';

  try {
    const r = await fetch('./data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`Could not load data.json (HTTP ${r.status}). Has the workflow run yet?`);
    const data = await r.json();

    const ts = new Date(data.generated).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

    let html = `<div class="report-header">
      <h2>📊 Monthly Reveal issue report — ${data.curr}</h2>
      <p class="baseline">Comparison baseline: ${data.prev} &nbsp;·&nbsp; Generated ${ts}</p>
    </div>`;

    for (const sec of data.sections) {
      // Attach curr label to section for window display
      sec.curr = data.curr;
      html += renderSection(sec);
    }

    output.innerHTML = html;
    output.className = 'visible';
    status.innerHTML = '✅ Done';
  } catch (e) {
    output.innerHTML = `<p class="error-msg">❌ ${e.message}</p>`;
    output.className = 'visible';
    status.innerHTML = '';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
