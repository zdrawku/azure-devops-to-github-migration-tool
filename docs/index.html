<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal Monthly Report</title>

<!-- Ignite UI Web Components: dark indigo theme -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/igniteui-webcomponents@5/themes/dark/indigo.css">

<!-- ApexCharts for charts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3/dist/apexcharts.min.js"></script>

<!-- Ignite UI Web Components: register needed components -->
<script type="module">
  import { defineComponents, IgcSelectComponent, IgcSelectItemComponent, IgcCardComponent, IgcBadgeComponent, IgcCircularProgressComponent } from 'https://cdn.jsdelivr.net/npm/igniteui-webcomponents@5/+esm';
  defineComponents(IgcSelectComponent, IgcSelectItemComponent, IgcCardComponent, IgcBadgeComponent, IgcCircularProgressComponent);
</script>

<style>
  /* ============================================================
     FONT SIZE — change this one value to scale the entire page.
     All component sizes below are expressed in em and inherit it.
     ============================================================ */
  :root { font-size: 18px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--ig-surface-500); color: var(--ig-gray-900);
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 1rem;
         display: flex; flex-direction: column; padding: 1em 1.5em; gap: .75em; }

  .topbar { display: flex; align-items: center; gap: 1em; flex-shrink: 0; flex-wrap: wrap; }
  .topbar h1 { font-size: 1.1em; font-weight: 700; white-space: nowrap; }
  .meta { color: var(--ig-gray-500); font-size: .85em; }
  #status { display: flex; align-items: center; gap: .5em; color: var(--ig-gray-500); font-size: .85em; }
  igc-select { --ig-size: 2; min-width: 180px; }

  #output { display: none; flex-direction: column; gap: .75em; }
  #output.visible { display: flex; }

  /* Unified cards container — all KPI cards and section cards in one flex flow */
  .cards-container { display: flex; flex-wrap: wrap; gap: .75em; align-items: flex-start; }
  .cards-container .kpi-card { width: 420px; height: 380px; flex: 0 0 auto; overflow: auto; }
  .cards-container igc-card { width: 620px; height: 380px; flex: 0 0 auto; }
  .cards-container .chart-section { width: 520px; height: 380px; flex: 0 0 auto; overflow: auto; }
  .kpi-card { background: var(--ig-surface-500); border: 1px solid var(--ig-gray-200);
              border-radius: 8px; padding: 1em 1.25em; }
  .kpi-card .kpi-title { font-size: .82em; font-weight: 700; text-transform: uppercase;
                          letter-spacing: .04em; color: var(--ig-gray-600); margin-bottom: .25em; }
  .kpi-card .kpi-value { font-size: 1.75em; font-weight: 700; line-height: 1.1; margin-bottom: .75rem; }
  .kpi-card .kpi-row { display: flex; justify-content: space-between; align-items: baseline;
                        padding: .2em 0; font-size: .88em; }
  .kpi-card .kpi-row .kpi-label { font-weight: 600; }
  .kpi-card .kpi-row .kpi-detail { color: var(--ig-gray-500); font-size: .93em; }
  .kpi-card .kpi-row .kpi-links { margin-top: .25em; font-size: .91em; color: var(--ig-gray-500); line-height: 1.35; }
  .kpi-card .kpi-row .kpi-links-label { font-weight: 600; color: var(--ig-gray-600); }
  .kpi-card .kpi-row .kpi-links a { color: var(--ig-primary-300); text-decoration: none; }
  .kpi-card .kpi-row .kpi-links a:hover { text-decoration: underline; }
  .kpi-card .kpi-row .kpi-links-none { color: var(--ig-gray-500); }
  .kpi-card .kpi-note { color: var(--ig-gray-500); font-size: .8em; margin-top: .6em;
                         border-top: 1px solid var(--ig-gray-200); padding-top: .5em; }
  .kpi-card .kpi-note code { background: var(--ig-gray-100); padding: .1em .3em;
                              border-radius: 3px; font-size: .88em; }

  .delta-up   { color: var(--ig-error-500); font-weight: 700; font-size: .88em; }
  .delta-down { color: var(--ig-success-500); font-weight: 700; font-size: .88em; }
  .delta-zero { color: var(--ig-gray-500); font-weight: 700; font-size: .88em; }

  .section-open-count { margin-bottom: .75em; }
  .section-open-count .open-count-num { font-size: 1.75em; font-weight: 700; line-height: 1.1; display: block; }
  .section-open-count .open-count-lbl { font-size: .82em; color: var(--ig-gray-500); }
  .section-open-count .open-count-sub { margin-top: .35em; font-size: .82em; color: var(--ig-gray-500); }
  .section-open-count .open-count-note { margin-top: .2em; font-size: .75em; color: var(--ig-gray-500); }

  /* Chart section */
  .chart-section { background: var(--ig-surface-500); border: 1px solid var(--ig-gray-200);
                   border-radius: 8px; padding: 1em 1.25em; }
  .chart-section h3 { font-size: .95em; font-weight: 700; margin-bottom: .5em; }
  #crashChart { width: 100%; height: 280px; }

  igc-card { --ig-size: 1; overflow: hidden; }
  igc-card-header { padding: .75em 1em .25em; }
  igc-card-content { padding: 0 1em .75em; }
  .cards-container igc-card igc-card-content { display: block; height: 450px; overflow: auto; }
  .card-title { font-size: .95em; font-weight: 700; margin-bottom: .15em; }
  .card-title a { color: var(--ig-primary-300); text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .window { color: var(--ig-gray-500); font-size: .8em; margin-bottom: .5em; }

  table { width: 100%; border-collapse: collapse; font-size: .88em; }
  th, td { text-align: left; padding: .3em .5em; border-bottom: 1px solid var(--ig-gray-200); }
  th { color: var(--ig-gray-500); font-weight: 600; font-size: .78em; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  tr.sub-hdr td { font-weight: 700; color: var(--ig-gray-500); padding-top: .6em; border-bottom: none;
                  font-size: .78em; text-transform: uppercase; letter-spacing: .04em; }
  tr.sub td:first-child { padding-left: 1em; color: var(--ig-gray-500); }
  .metric-links { margin-top: .18em; font-size: .95em; line-height: 1.35; color: var(--ig-gray-500); }
  .metric-links a { color: var(--ig-primary-300); text-decoration: none; }
  .metric-links a:hover { text-decoration: underline; }

  .error-msg { color: var(--ig-error-500); font-size: .95em; padding: 1em; }

  .trend-section { background: var(--ig-surface-500); border: 1px solid var(--ig-gray-200);
                   border-radius: 8px; padding: 1em 1.25em; width: 100%; }
  .trend-section h3 { font-size: .95em; font-weight: 700; margin-bottom: .25em; }
  .trend-section .trend-meta { color: var(--ig-gray-500); font-size: .8em; margin-bottom: .75em; }
  #trendChart { width: 100%; height: 320px; }

  @media (max-width: 520px) {
    .cards-container .kpi-card,
    .cards-container igc-card,
    .cards-container .chart-section {
      width: 100%;
      max-width: 100%;
      height: auto;
    }
    .cards-container igc-card igc-card-content { height: auto; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>📊 Reveal Monthly Report</h1>
  <igc-select id="monthSelect" label="Period" placeholder="Loading…"></igc-select>
  <span id="status"></span>
  <span class="meta" id="generated"></span>
</div>

<div id="output"></div>

<script type="module">
function formatMonth(yyyymm) {
  const [y, m] = yyyymm.split('-');
  return new Date(+y, +m - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function badge(delta) {
  if (delta > 0) return `<span class="delta-up">+${delta}</span>`;
  if (delta < 0) return `<span class="delta-down">${delta}</span>`;
  return `<span class="delta-zero">±0</span>`;
}

function formatMonthLabel(yyyymm, isCurrent) {
  const [y, m] = yyyymm.split('-');
  const d = new Date(+y, +m - 1, 1);
  const name = d.toLocaleString(undefined, { month: 'long' });
  return isCurrent ? `${name} (so far)` : name;
}

function renderIssueRefs(label, refs) {
  if (!refs) return '';

  const total = Number(refs.total || 0);
  if (!total) {
    return `<div class="kpi-links"><span class="kpi-links-label">${label}:</span> <span class="kpi-links-none">none</span></div>`;
  }

  const issues = Array.isArray(refs.issues) ? refs.issues : [];
  const links = issues
    .map(i => `<a href="${escapeHtml(i.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(i.title || '')}">#${escapeHtml(i.number)}</a>`)
    .join(', ');
  const more = total > issues.length && refs.search_url
    ? `${issues.length ? ', ' : ''}<a href="${escapeHtml(refs.search_url)}" target="_blank" rel="noopener noreferrer">+${total - issues.length} more</a>`
    : '';

  return `<div class="kpi-links"><span class="kpi-links-label">${label}:</span> ${links}${more}</div>`;
}

function renderMetricRefs(refs) {
  if (!refs || Number(refs.total || 0) === 0) return '';

  const issues = Array.isArray(refs.issues) ? refs.issues : [];
  const links = issues
    .map(i => `<a href="${escapeHtml(i.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(i.title || '')}">#${escapeHtml(i.number)}</a>`)
    .join(', ');

  const total = Number(refs.total || 0);
  const more = total > issues.length && refs.search_url
    ? `${issues.length ? ', ' : ''}<a href="${escapeHtml(refs.search_url)}" target="_blank" rel="noopener noreferrer">+${total - issues.length} more</a>`
    : '';

  return `<div class="metric-links">${links}${more}</div>`;
}

function renderSummaryCard(card, currLabel, prevLabel) {
  const headline = `<div class="kpi-value">${card.total_open}</div>`;
  return `<div class="kpi-card">
    <div class="kpi-title">${card.title}</div>
    ${headline}
    <div class="kpi-row">
      <span><span class="kpi-label">${formatMonthLabel(currLabel, true)}</span><br>
        <span class="kpi-detail">${card.curr_added} added · ${card.curr_closed} closed</span>
        ${renderIssueRefs('Added', card.curr_added_refs)}
        ${renderIssueRefs('Closed', card.curr_closed_refs)}</span>
      ${badge(card.curr_delta)}
    </div>
    <div class="kpi-row">
      <span><span class="kpi-label">${formatMonthLabel(prevLabel, false)}</span><br>
        <span class="kpi-detail">${card.prev_added} added · ${card.prev_closed} closed</span></span>
      ${badge(card.prev_delta)}
    </div>
    <div class="kpi-note">${card.note}</div>
  </div>`;
}

function renderChart(crashByPlatform) {
  const hasData = crashByPlatform.some(p => p.count > 0);
  if (!hasData) return '<div class="chart-section"><h3>Crash reports by platform</h3><p style="color:var(--ig-gray-500);font-size:.8rem;">No open crash reports</p></div>';
  return `<div class="chart-section">
    <h3>Crash reports by platform</h3>
    <div id="crashChart"></div>
  </div>`;
}

function formatTrendMonth(yyyymm) {
  const [y, m] = yyyymm.split('-');
  return new Date(+y, +m - 1, 1).toLocaleString(undefined, { month: 'short', year: 'numeric' });
}

function renderTrendSection() {
  return `<section class="trend-section">
    <h3>Bugs Trend Over Time</h3>
    <div class="trend-meta">Series: Reveal SDK Public, Reveal Private, Slingshot Bugs</div>
    <div id="trendChart"></div>
  </section>`;
}

let trendDataCache = null;
let trendDataCacheKey = '';
let trendChartInstance = null;

async function getTrendData(months) {
  const key = months.join(',');
  if (trendDataCache && trendDataCacheKey === key) return trendDataCache;

  const points = [];
  for (const month of months) {
    try {
      const r = await fetch(`./data-${month}.json`, { cache: 'no-cache' });
      if (!r.ok) continue;
      const data = await r.json();
      const publicOpen = data.sections?.[0]?.open_bug_count ?? data.sections?.[0]?.open_count;
      const privateOpen = data.sections?.[1]?.open_bug_count ?? data.sections?.[1]?.open_count;
      const slingshotOpen = data.summary?.bugs?.total_open;
      points.push({
        month: formatTrendMonth(month),
        publicSdkOpenBugs: Number(publicOpen ?? 0),
        privateRevealOpenBugs: Number(privateOpen ?? 0),
        slingshotOpenBugs: Number(slingshotOpen ?? 0),
      });
    } catch (_) {
      // Skip missing/unreadable month data and render what is available.
    }
  }

  trendDataCache = points;
  trendDataCacheKey = key;
  return points;
}

async function mountTrendChart(months) {
  const el = document.getElementById('trendChart');
  if (!el || !Array.isArray(months) || months.length === 0) return;

  const points = await getTrendData(months);
  if (!points.length) return;

  if (trendChartInstance) {
    trendChartInstance.destroy();
    trendChartInstance = null;
  }

  const options = {
    chart: {
      type: 'line',
      height: el.clientHeight || 320,
      width: '100%',
      background: 'transparent',
      toolbar: { show: true },
      animations: { enabled: true },
    },
    series: [
      { name: 'Reveal SDK Public', data: points.map(p => p.publicSdkOpenBugs) },
      { name: 'Reveal Private', data: points.map(p => p.privateRevealOpenBugs) },
      { name: 'Slingshot Bugs', data: points.map(p => p.slingshotOpenBugs) },
    ],
    xaxis: {
      categories: points.map(p => p.month),
      labels: { style: { colors: '#ccc' } },
    },
    yaxis: {
      title: { text: 'Open bugs', style: { color: '#ccc' } },
      labels: { style: { colors: '#ccc' } },
      min: 0,
      forceNiceScale: true,
    },
    stroke: { width: 3, curve: 'smooth' },
    markers: { size: 4 },
    dataLabels: { enabled: false },
    legend: { position: 'top', labels: { colors: '#ccc' } },
    colors: ['#4fc3f7', '#ffa726', '#66bb6a'],
    grid: { borderColor: 'rgba(255,255,255,0.12)' },
    tooltip: { shared: true },
    theme: { mode: 'dark' },
  };

  trendChartInstance = new ApexCharts(el, options);
  trendChartInstance.render();
}

function mountChart(crashByPlatform) {
  const hasData = crashByPlatform.some(p => p.count > 0);
  if (!hasData) return;
  const el = document.getElementById('crashChart');
  if (!el) return;
  const options = {
    chart: { type: 'donut', height: el.clientHeight || 280, width: '100%', background: 'transparent' },
    series: crashByPlatform.map(p => p.count),
    labels: crashByPlatform.map(p => p.label),
    colors: ['#4fc3f7', '#7e57c2', '#66bb6a', '#ffa726', '#ef5350'],
    legend: { position: 'right', fontSize: '13px', labels: { colors: '#ccc' } },
    dataLabels: { enabled: false },
    stroke: { show: false },
    plotOptions: { pie: { donut: { size: '60%' } } },
    theme: { mode: 'dark' },
  };
  new ApexCharts(el, options).render();
}

function repoSlug(url) {
  // Extract "owner/repo" from a github.com URL
  const m = url.match(/github\.com\/([^/]+\/[^/]+)/);
  return m ? m[1] : url;
}

function renderSection(sec, curr, prev) {
  let rows = '';
  for (const m of sec.metrics) {
    rows += `<tr><td>${m.label}${renderMetricRefs(m.current_refs)}</td><td>${m.current}</td><td>${badge(m.delta)}</td></tr>\n`;
  }
  for (const sub of sec.subsections) {
    rows += `<tr class="sub-hdr"><td colspan="3">${sub.title}</td></tr>\n`;
    for (const m of sub.metrics) {
      rows += `<tr class="sub"><td>${m.label}</td><td>${m.current}</td><td>${badge(m.delta)}</td></tr>\n`;
    }
  }
  const hasOpenMetrics = sec.open_count != null;
  const openIssueLabel = sec.open_count_label || 'open issues';
  const openBugCount = sec.open_bug_count;
  const liveOpenIssues = sec.live_open_count;
  const liveOpenBugs = sec.live_open_bug_count;
  const hasLive = liveOpenIssues != null && liveOpenBugs != null;
  const openHtml = hasOpenMetrics
    ? `<div class="section-open-count">
         <span class="open-count-num">${sec.open_count}</span>
         <span class="open-count-lbl">${openIssueLabel}</span>
         ${openBugCount != null ? `<div class="open-count-sub"><strong>${openBugCount}</strong> open bugs as of ${curr}</div>` : ''}
         ${hasLive ? `<div class="open-count-sub">Live now: <strong>${liveOpenIssues}</strong> open issues · <strong>${liveOpenBugs}</strong> open bugs</div>` : ''}
         <div class="open-count-note">Snapshot open count uses month-end logic (created before period end and not closed by period end). Live now uses <code>is:open</code> and <code>is:open type:Bug</code>.</div>
       </div>`
    : '';
  return `<igc-card>
    <igc-card-header>
      <h3 slot="title" class="card-title"><a href="${sec.url}">${sec.title}</a></h3>
      <h5 slot="subtitle" class="window">${repoSlug(sec.url)} · ${curr} vs ${prev}</h5>
    </igc-card-header>
    <igc-card-content>
      ${openHtml}
      <table>
        <thead><tr><th>Metric</th><th>#</th><th>vs prev</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </igc-card-content>
  </igc-card>`;
}

let latestMonth = null;
let availableMonths = [];

async function loadReport(month) {
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const gen = document.getElementById('generated');

  status.innerHTML = '<igc-circular-progress indeterminate style="--ig-size:1;width:20px;height:20px;"></igc-circular-progress> Loading…';
  output.className = '';
  output.innerHTML = '';
  gen.textContent = '';

  try {
    const r = await fetch(`./data-${month}.json`, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`data-${month}.json not found (HTTP ${r.status})`);
    const data = await r.json();

    const ts = new Date(data.generated).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    gen.textContent = `${data.curr} vs ${data.prev} · generated ${ts}`;

    const [sdkSec, privateSec] = data.sections || [];
    const s = data.summary || {};

    // All cards in one flex container, in the specified order:
    // 1. Reveal SDK (Public) section
    // 2. ALL NEW BUGS · REVEAL (PRIVATE)
    // 3. Reveal (Private) section
    // 4. ALL OPEN SLINGSHOT ISSUES
    // 5. SLINGSHOT BUGS (EXCL. CRASH REPORTS)
    // 6. SLINGSHOT CRASH REPORTS
    // 7. Crash by platform chart
    let html = '<div class="cards-container">';
    if (sdkSec)             html += renderSection(sdkSec, data.curr, data.prev);
    if (s.all_private_bugs) html += renderSummaryCard(s.all_private_bugs, data.curr, data.prev);
    if (privateSec)         html += renderSection(privateSec, data.curr, data.prev);
    if (s.all_slingshot)    html += renderSummaryCard(s.all_slingshot, data.curr, data.prev);
    if (s.bugs)             html += renderSummaryCard(s.bugs, data.curr, data.prev);
    if (s.crash_reports)    html += renderSummaryCard(s.crash_reports, data.curr, data.prev);
    if (s.crash_by_platform) html += renderChart(s.crash_by_platform);
    html += '</div>';
    html += renderTrendSection();

    output.innerHTML = html;
    output.className = 'visible';
    status.innerHTML = '';

    // Mount chart after DOM is updated and layout is flushed
    if (s.crash_by_platform) {
      requestAnimationFrame(() => mountChart(s.crash_by_platform));
    }
    requestAnimationFrame(() => {
      mountTrendChart(availableMonths);
    });
  } catch (e) {
    output.innerHTML = `<p class="error-msg">❌ ${e.message}</p>`;
    output.className = 'visible';
    status.innerHTML = '';
  }
}

async function init() {
  await customElements.whenDefined('igc-select');
  const select = document.getElementById('monthSelect');
  const status = document.getElementById('status');

  try {
    const r = await fetch('./manifest.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`manifest.json not found (HTTP ${r.status})`);
    const manifest = await r.json();

    if (!manifest.months || manifest.months.length === 0) {
      select.placeholder = 'No reports yet';
      return;
    }

    availableMonths = [...manifest.months];

    // Populate newest-first
    [...manifest.months].reverse().forEach(m => {
      const item = document.createElement('igc-select-item');
      item.value = m;
      item.textContent = formatMonth(m);
      select.appendChild(item);
    });

    select.addEventListener('igcChange', () => {
      if (select.value) loadReport(select.value);
    });

    // Auto-select and load latest month
    latestMonth = manifest.latest;
    requestAnimationFrame(() => {
      select.value = manifest.latest;
      loadReport(manifest.latest);
    });
  } catch (e) {
    status.textContent = `❌ ${e.message}`;
  }
}

init();
</script>
</body>
</html>
